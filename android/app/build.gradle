plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hatdagger.calmcombo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hatdagger.calmcombo'
        minSdk 24
        targetSdk 34
        // every GitHub build gets a higher number, so a new APK installs over the old one
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // A fixed hobby signing key kept in the repo, so each new build can be
    // installed over the last one without uninstalling (and losing scores).
    signingConfigs {
        hobby {
            storeFile file('calm-hobby.keystore')
            storePassword 'calmcombo'
            keyAlias 'calm'
            keyPassword 'calmcombo'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.hobby
        }
        debug {
            signingConfig signingConfigs.hobby
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'ogg', 'wav'
    }
}
