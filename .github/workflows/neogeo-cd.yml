name: Neo Geo CD build

on:
  push:
    paths:
      - 'neogeo-cd/**'
      - 'web/index.html'
      - '.github/workflows/neogeo-cd.yml'
  workflow_dispatch:

jobs:
  rules-parity:
    name: Board rules match the web prototype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build PC harness (strict C89)
        working-directory: neogeo-cd
        run: gcc -std=c89 -pedantic -Wall -Wextra -Werror -O2 -o sim src/board.c test/sim.c
      - name: Compare 25 seeded games
        working-directory: neogeo-cd
        run: |
          for s in $(seq 1 20) 42 1234 99999 123456789 987654321; do
            ./sim $s 80 > c.txt
            node test/parity.js ../web/index.html $s 80 > j.txt
            cmp c.txt j.txt || { echo "seed $s differs"; diff c.txt j.txt | head; exit 1; }
          done
          echo "all seeds match"

  frontend:
    name: Front end smoke test + screenshots (PC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Build main.c against stand-in hardware (strict C89)
        working-directory: neogeo-cd
        run: sh test/build_frontend.sh build-pc
      - name: Play the tour script and render screenshots
        working-directory: neogeo-cd
        run: |
          mkdir -p shots
          build-pc/frontend test/tour.txt shots
          build-pc/frontend test/scenes.txt shots
          python3 test/render_frames.py shots --sheet shots/00_sheet.png
      - uses: actions/upload-artifact@v4
        with:
          name: CalmCombo-screenshots
          path: neogeo-cd/shots/*.png

  assets:
    name: Asset check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Check art and audio against the asset brief
        run: python3 neogeo-cd/tools/check_assets.py

  iso:
    name: Build ISO + MAME CHD (NeoCore)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy
      - name: Audio (placeholder songs for missing tracks, sound-chip files from sfx/*.wav)
        working-directory: neogeo-cd
        run: python tools/make_audio.py
      - name: Build sprites, program, ISO and CHD
        working-directory: neogeo-cd/src
        shell: powershell
        run: |
          $bm = "..\neocore\toolchain\scripts\Builder-Manager.ps1"
          $checks = @{ "make" = "..\build\CalmCombo\CalmCombo.prg" }
          foreach ($rule in @("lib", "sprite", "make", "dist:iso", "dist:mame")) {
            if ($rule -eq "dist:iso") {
              # NeoCore's CUE writer reads the CD tracks from the build folder
              New-Item -ItemType Directory -Force -Path ..\build\CalmCombo\assets\cdda | Out-Null
              Copy-Item assets\cdda\*.wav ..\build\CalmCombo\assets\cdda\ -Force
            }
            Write-Host "=== mak $rule ===" -ForegroundColor Cyan
            powershell -ExecutionPolicy Bypass -File $bm -ConfigFile project.xml -Rule $rule
            if ($LASTEXITCODE -ne 0) { throw "mak $rule failed" }
            if ($checks[$rule] -and -not (Test-Path $checks[$rule])) {
              Get-Content ..\build\CalmCombo\gcc.log -ErrorAction SilentlyContinue
              throw "mak $rule did not produce $($checks[$rule])"
            }
          }
      - name: Raw BIN/CUE (MODE1/2352 data + audio tracks)
        working-directory: neogeo-cd
        run: python tools/make_bincue.py dist/CalmCombo/CalmCombo-1.0.0/cd/iso bincue
      - uses: actions/upload-artifact@v4
        with:
          name: CalmCombo-BINCUE
          path: neogeo-cd/bincue/
          if-no-files-found: error
      - name: List output
        if: always()
        shell: powershell
        run: |
          if (Test-Path neogeo-cd\dist) { Get-ChildItem -Recurse neogeo-cd\dist | Select-Object FullName, Length }
      - uses: actions/upload-artifact@v4
        with:
          name: CalmCombo-NeoGeoCD
          path: neogeo-cd/dist/
          if-no-files-found: error
